paths:
  raw: data/raw
  transcripts: data/transcripts
  cuts: data/cuts
  chapters: data/chapters
  output: data/output
  outro: assets/outro/outro.mp4

facecam_region:                  # posición aproximada de la webcam del streamer, como FRACCIÓN 0.0-1.0
  x: 0.007813                    # del frame (no píxeles absolutos, cambiado 2026-08-10 -- ver
  y: 0.370370                    # src.common.face_detection.facecam_region_to_pixels): funciona igual sin
  w: 0.190104                    # importar la resolución del vídeo, asumiendo que la webcam ocupa una
  h: 0.194444                    # proporción similar del canvas de OBS entre grabaciones. Compartido entre
                                  # detect_cuts (recorte de intro por detección de cara, exclusión de esta
                                  # zona del cálculo de movimiento) y edit (zoom hacia la webcam); no hace
                                  # falta encuadrar la cara con precisión, solo aproximar la zona. Valor
                                  # exacto = conversión de la calibración original en píxeles sobre el frame
                                  # 1920x1080 de dinoblade_1/icarus_1 (x:15,y:400,w:365,h:210) -- deriva el
                                  # mismo recorte exacto para cualquier vídeo a esa resolución. Ajustar si
                                  # cambia la disposición de la escena en OBS.

transcribe:
  whisper_model: medium
  device: cpu
  language: es
  vad_filter: true               # filtra tramos sin voz antes de transcribir; evita alucinaciones de Whisper en silencios largos

detect_cuts:
  silence_min_seconds: 0.8       # duración mínima de silencio para considerarlo candidato
  silence_db_threshold: -35      # umbral de energía de audio (dB) por debajo del cual se considera silencio
  silence_onset_margin_db: 10    # umbral estricto = silence_db_threshold - esto; recorta los bordes de cada
                                  # candidato a su núcleo de silencio profundo, para no comerse una voz que
                                  # empieza floja y va subiendo de volumen hasta cruzar silence_db_threshold
  motion_threshold: 0.15         # por debajo de esto = "quietud visual" (0.0-1.0, mismo rango que newclips)
  exclude_facecam_from_motion: true  # excluye facecam_region del cálculo de movimiento visual (idea tomada de
                                      # auto-editor: restringir el análisis a una región del frame); si no, el
                                      # propio streamer moviéndose en su webcam (gestos, risas) cuenta como
                                      # "movimiento" y evita cortar un silencio real sin acción en el contenido.
                                      # Desactivar para volver al comportamiento anterior (analizar el frame completo)
  filler_words: [eh, esto, o sea, bueno bueno]
  cut_margin_seconds: 0.2        # margen de seguridad que se deja sin cortar alrededor del tramo detectado
  trim_intro: true               # recorta automáticamente la intro (desde 0 hasta que aparece una cara
                                  # real en facecam_region); no depende de silencio+movimiento, se aplica
                                  # siempre que se detecte con fiabilidad
  intro_face_sample_interval_seconds: 1.5   # cada cuántos segundos se muestrea el vídeo buscando cara en facecam_region
  intro_face_confirm_window_seconds: 8      # ventana (s) sobre la que se exige intro_face_min_detection_ratio de
                                             # muestras con cara para confirmar que "ya apareció de verdad" (evita
                                             # falsos negativos puntuales: parpadeo, frame raro)
  intro_face_min_detection_ratio: 0.7       # proporción mínima de muestras con cara detectada dentro de esa ventana
  intro_face_max_search_seconds: 1200       # si no se detecta cara fiable en los primeros 20 min, no se recorta nada
                                             # (evita cortar el vídeo entero por un fallo del detector); subido de 15
                                             # a 20 min tras validar contra dinoblade_1 real, cuya intro (pantalla de
                                             # carga + tramo de webcam a pantalla completa antes de la disposición de
                                             # juego normal) dura ~17-18 min, más que el límite anterior

detect_chapters:
  claude_model: claude-sonnet-5
  min_chapter_seconds: 120        # no generar capítulos más cortos que esto

edit:
  long_speech_min_seconds: 10      # duración mínima (en el vídeo original) de un tramo de habla continua para
                                    # aplicarle el zoom hacia la webcam
  long_speech_gap_seconds: 1.2     # hueco máximo entre el fin de una palabra y el inicio de la siguiente para
                                    # seguir considerándolas parte del mismo tramo de habla continua
  long_speech_zoom_factor: 1.0    # escala máxima que alcanza el zoom al completar la rampa; 1.0 = sin zoom
  zoom_in_duration_seconds: 4.5    # duración de la rampa de entrada del zoom (subida lenta); al completarse
                                    # la rampa se vuelve a 1.0 de golpe, sin rampa de salida (no espera al
                                    # final del tramo de habla). Tramos de habla más cortos que esto se quedan
                                    # sin zoom (no da tiempo a completar la rampa)
  loudnorm: true
  prepend_intro: true      # antepone data/output/<video_id>/intro.mp4 (si existe) al principio del vídeo final
  append_outro: true

thumbnail:
  enabled: true                    # extraer frames candidatos automáticamente; si es false, run() no hace nada (avisa en el log)
  candidate_sample_count: 60       # nº de puntos muestreados por movimiento a lo largo del vídeo ANTES de quedarse
                                    # con los --num-candidates de mayor puntuación separados por --min-gap-seconds
                                    # (ver src/thumbnail/run.py); muestreo ligero (diferencia de píxeles, no optical
                                    # flow), así que sigue siendo cosa de segundos

subtitles:
  enabled: true                    # generar subtitles.srt automáticamente; si es false, run() no hace nada (avisa en el log)
  max_chars_per_line: 42           # estándar de la industria para contenido largo, estilo estático sin animación
  max_lines: 2                     # máximo de líneas visibles por subtítulo
  min_cue_seconds: 1.0             # tiempo mínimo en pantalla de un subtítulo
  max_cue_seconds: 6.0             # tiempo máximo en pantalla de un subtítulo
  reading_cps_min: 15              # ritmo de lectura de referencia (caracteres/segundo), banda 15-20; solo el
  reading_cps_max: 20              # límite superior se aplica como suelo de duración, ver src/subtitles/run.py
  natural_pause_gap_seconds: 0.5   # hueco entre palabras a partir del cual se considera una pausa natural donde
                                    # es preferible cortar un subtítulo (además de puntuación de frase/cláusula)

youtube:
  expected_channel_name: Zelleq    # nombre EXACTO del canal de YouTube al que deben ir las subidas (opcional).
                                    # Si se rellena, publish/youtube.py aborta con un error claro ANTES de subir
                                    # si el token OAuth actual (token.json) está vinculado a un canal distinto --
                                    # el flujo OAuth se vincula al canal que esté activo en el NAVEGADOR al
                                    # autorizar, no necesariamente al que se quiere, y la API de YouTube no
                                    # permite elegir canal de destino por parámetro en la subida (bug real,
                                    # 2026-08-10: una subida acabó en un canal equivocado por esto)
